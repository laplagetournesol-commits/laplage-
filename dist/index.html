<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Les Tournesols</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/favicon.ico" />
    <style id="beach-overrides">
      /* Cacher les numéros sur les marqueurs de la carte plage */
      div[style*="font-size:8px"][style*="font-weight:900"][style*="color:rgb(255,255,255)"],
      div[style*="font-size: 8px"][style*="font-weight: 900"][style*="color: rgb(255, 255, 255)"] {
        visibility: hidden !important;
      }
      /* Cacher l'ancienne bannière de prix */
      div[style*="position:absolute"][style*="bottom:40px"][style*="flex-direction:row"],
      div[style*="position: absolute"][style*="bottom: 40px"][style*="flex-direction: row"] {
        display: none !important;
      }
      /* Nouvelle bannière de prix */
      #price-banner {
        position: fixed;
        bottom: 56px;
        left: 0;
        right: 0;
        display: flex;
        z-index: 999;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #price-banner .pb-item {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 6px;
        gap: 6px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
      }
      #price-banner .pb-price {
        font-weight: 800;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/_expo/static/js/web/entry-v2-nolabels.js" defer></script>
  <div id="price-banner" style="display:none;">
    <div class="pb-item" style="background:rgba(212,175,55,0.92);">
      <span>1ère Ligne</span>
      <span class="pb-price">25€ / jour</span>
    </div>
    <div class="pb-item" style="background:rgba(101,67,33,0.92);">
      <span>Transat + parasol</span>
      <span class="pb-price">20€ / jour</span>
    </div>
    <div class="pb-item" style="background:rgba(85,85,60,0.92);">
      <span>Chaise longue</span>
      <span class="pb-price">10€ / jour</span>
    </div>
  </div>
  <script>
    // Afficher la bannière uniquement sur la page plage
    function checkBanner() {
      var b = document.getElementById('price-banner');
      if (b) b.style.display = location.pathname.includes('beach') ? 'flex' : 'none';
    }
    setInterval(checkBanner, 500);
  </script>
</body>
</html>
